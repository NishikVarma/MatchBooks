name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # compiles, runs all tests, enforces the 90% line-coverage gate (jacoco check)
      - name: Build and verify
        run: mvn -B verify
